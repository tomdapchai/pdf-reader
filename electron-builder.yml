{
  "appId": "com.pdfreader.app",
  "productName": "PDF Reader",
  "directories": {
    "buildResources": "build",
    "output": "dist"
  },
  "files": ["out/**/*", "package.json"],
  "win": {
    "target": ["nsis"]
  },
  "mac": {
    "target": ["dmg"],
    "category": "public.app-category.productivity"
  },
  "linux": {
    "target": ["AppImage"]
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  }
}
